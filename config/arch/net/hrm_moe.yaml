name: baselines.hrm_moe_nocarry_bp_warmup@HierarchicalMoEModel
head: moe_lm_head@MoELMHead

# OpenEuroLLM-128k leaves a large vocabulary matrix; share it with the output
# projection for the from-scratch MoE path.
tie_word_embeddings: true

# Preserve the production HRM2 state graph and H2/L3 recurrence.
half_layers: true
H_cycles: 2
L_cycles: 3
H_override: {}

bp_warmup_ratio: 0.2
bp_min_steps: 2
bp_max_steps: 5

# Correctness-first reference placement: the final physical L feedforward.
# Negative indices are resolved relative to each post-split H/L stack.
H_moe_layers: []
L_moe_layers: [-1]

moe_num_experts: 8
moe_top_k: 2
moe_expert_expansion_scale: 0.5
moe_router_weighting: renormalized
moe_router_score_function: sigmoid
moe_router_init_std: 0.01
moe_router_jitter_noise: 0.01
moe_router_bias_update_rate: 0.001
# Loss-free bias control carries the batch-level balancing burden. Retain only
# a small differentiable sequence-level term; sigmoid routing does not use the
# softmax router z-loss in the objective.
moe_balance_loss_weight: 0.001
moe_z_loss_weight: 0.0
