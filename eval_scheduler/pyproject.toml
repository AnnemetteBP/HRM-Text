[project]
name = "hrm-eval-scheduler"
version = "0.1.0"
description = "Plan-first HRM evaluation scheduler"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
shared = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
]
rich = [
    "rich>=13",
]

[project.scripts]
hrm-eval-scheduler = "eval_scheduler.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval_scheduler"]
